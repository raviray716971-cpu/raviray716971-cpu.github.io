<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Agent</title>
<style>
  :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #5f6368; --accent: #1a73e8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #ececec; --muted: #a0a0a0; --accent: #8ab4f8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.8rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Countdown Agent</h1>
  <p>Countdown Agent is a private tool that makes short animal-facts videos and uploads them to two
  YouTube channels owned by the same person: <a href="https://www.youtube.com/@ReginaldRates">Sir Reginald Reviews</a>
  and <a href="https://www.youtube.com/@ProfessorUlluKiClass">Professor Ullu Ki Class</a>.</p>
  <p>It is not a public service and does not accept other users.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
